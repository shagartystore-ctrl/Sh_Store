<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة شجرتي</title><link rel="stylesheet" href="styles.css">
  <style>
    body{background:#eef0e8}.admin{max-width:1200px;margin:auto;padding:40px 22px}.admin-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.admin h1{font:700 42px Georgia;margin:0}.admin-card{background:#fffdf8;padding:24px;margin-bottom:22px;box-shadow:0 10px 30px #19352b12}.admin-form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.admin-form input,.admin-form select,.admin-form textarea{border:1px solid #dfe0d5;padding:12px;font:13px Cairo}.admin-form textarea{min-height:80px;grid-column:1/-1}.admin-form .wide{grid-column:1/-1}.admin-table{width:100%;border-collapse:collapse;font-size:12px}.admin-table th,.admin-table td{padding:12px 8px;border-bottom:1px solid #e1e4da;text-align:right;vertical-align:top}.admin-table img{width:90px;max-height:110px;object-fit:cover;border:1px solid #dfe0d5}.admin-msg{color:#c87935;margin-top:12px}.login{max-width:420px;margin:12vh auto;background:#fffdf8;padding:32px;box-shadow:0 20px 60px #19352b18}.login h1{font:700 34px Georgia}.login input{display:block;width:100%;padding:14px;margin:10px 0;border:1px solid #dfe0d5;font:13px Cairo}.order-address{max-width:180px;white-space:normal}@media(max-width:700px){.admin-form{grid-template-columns:1fr}.admin-top{display:block}.admin h1{font-size:34px;margin-bottom:15px}.admin-table{font-size:10px;display:block;overflow-x:auto;white-space:nowrap}.admin-table th,.admin-table td{padding:8px 4px}}
  </style>
</head>
<body>
  <section class="login" id="login"><div class="brand"><span class="brand-mark">ش</span><span><strong>شجرتي</strong><small>لوحة الإدارة</small></span></div><h1>أهلاً بك</h1><p>ادخل رمز الأدمن لإدارة المنتجات والطلبات.</p><input id="adminToken" type="password" placeholder="رمز الأدمن"><button class="button button-primary" id="loginBtn">دخول</button><p class="admin-msg" id="loginMsg"></p></section>
  <main class="admin" id="dashboard" hidden>
    <div class="admin-top"><div><p class="eyebrow">إدارة المتجر</p><h1>لوحة شجرتي</h1></div><button class="button button-dark" id="logout">خروج</button></div>
    <section class="admin-card"><h2>إضافة منتج</h2><form class="admin-form" id="productForm"><input name="name" placeholder="اسم المنتج" required><input name="price" type="number" placeholder="السعر بالجنيه" required><input name="description" placeholder="الوصف"><select name="category"><option value="oil">زيت</option><option value="gift">هدية</option></select><input name="tag" placeholder="الشارة"><input name="image_url" class="wide" placeholder="رابط صورة Cloudinary"><button class="button button-primary wide">إضافة المنتج</button></form><p class="admin-msg" id="productMsg"></p></section>
    <section class="admin-card"><h2>المنتجات</h2><div id="productsTable">جارِ التحميل…</div></section>
    <section class="admin-card"><h2>الطلبات</h2><div id="ordersTable">جارِ التحميل…</div></section>
  </main>
  <script>
    const API_BASE='https://shagarty-store-api.youssefzeweil1.workers.dev';
    let token=sessionStorage.getItem('shagarty_admin_token')||'';
    const $=(selector)=>document.querySelector(selector);
    const api=async(path,options={})=>{const response=await fetch(API_BASE+path,{...options,headers:{'Content-Type':'application/json','X-Admin-Token':token,...(options.headers||{})}});const data=await response.json();if(!response.ok)throw Error(data.error||'حدث خطأ');return data};
    const paymentLabel=(value)=>value==='vodafone_cash'?'Vodafone Cash':'الدفع عند الاستلام';
    function show(){$('#login').hidden=true;$('#dashboard').hidden=false;loadAll()}
    async function loadAll(){try{const products=await api('/api/admin/products');$('#productsTable').innerHTML='<table class="admin-table"><tr><th>المنتج</th><th>السعر</th><th>التصنيف</th><th>الحالة</th></tr>'+products.products.map((x)=>`<tr><td>${x.name}</td><td>${x.price} ج.م</td><td>${x.category}</td><td>${x.active?'نشط':'مخفي'}</td></tr>`).join('')+'</table>';const orders=await api('/api/admin/orders');$('#ordersTable').innerHTML=orders.orders.length?'<table class="admin-table"><tr><th>#</th><th>العميل</th><th>التواصل والعنوان</th><th>الدفع</th><th>الإجمالي</th><th>الإيصال</th><th>الحالة</th></tr>'+orders.orders.map((x)=>`<tr><td>${x.id}<br><small>${x.created_at}</small></td><td>${x.customer_name}<br>${x.phone}</td><td class="order-address">${x.address}<br>${x.notes||''}</td><td>${paymentLabel(x.payment_method)}<br>الشحن: ${x.shipping_fee||80} ج.م</td><td>${x.total} ج.م</td><td>${x.receipt_data?`<a href="${x.receipt_data}" target="_blank" rel="noopener"><img src="${x.receipt_data}" alt="إيصال الطلب ${x.id}"></a>`:'لا يوجد'}</td><td>${x.status}</td></tr>`).join('')+'</table>':'لا توجد طلبات بعد.'}catch(error){$('#productMsg').textContent=error.message}}
    $('#loginBtn').onclick=async()=>{token=$('#adminToken').value.trim();try{await api('/api/admin/products');sessionStorage.setItem('shagarty_admin_token',token);show()}catch(error){$('#loginMsg').textContent='الرمز غير صحيح أو الـ API غير منشور بعد.'}};
    $('#logout').onclick=()=>{sessionStorage.removeItem('shagarty_admin_token');location.reload()};
    $('#productForm').onsubmit=async(event)=>{event.preventDefault();try{await api('/api/admin/products',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(event.target)))});event.target.reset();$('#productMsg').textContent='تمت إضافة المنتج.';loadAll()}catch(error){$('#productMsg').textContent=error.message}};
    if(token)show();
  </script>
</body>
</html>
