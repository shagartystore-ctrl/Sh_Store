<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="تفاصيل منتج شجرتي وتقييمات العملاء">
  <title>تفاصيل المنتج | شجرتي</title><link rel="stylesheet" href="styles.css">
  <style>
    .product-page{max-width:1180px;margin:55px auto;padding:0 24px}.breadcrumbs{color:#69756b;font-size:13px;margin-bottom:22px}.product-detail{display:grid;grid-template-columns:1.05fr .95fr;gap:46px;background:#fffdf8;border:1px solid #dfe0d5;padding:30px}.detail-media{min-height:430px;display:grid;place-items:center;background:#f3f4ed}.detail-media img,.detail-media video{max-width:100%;max-height:520px;width:100%;height:100%;object-fit:contain}.detail-info h1{font-size:36px;margin:0 0 14px}.detail-info .description{line-height:2;color:#5f6b61}.rating-summary{color:#c87935;font-size:20px;margin:18px 0}.rating-summary small{font-size:12px;color:#69756b}.buy-box{border-top:1px solid #dfe0d5;margin-top:24px;padding-top:20px}.buy-box .button{width:100%;margin-top:12px}.reviews-area{margin-top:40px;background:#fffdf8;border:1px solid #dfe0d5;padding:28px}.reviews-heading{display:flex;justify-content:space-between;align-items:end;gap:20px}.reviews-heading h2{margin:0}.reviews-summary{display:grid;grid-template-columns:180px 1fr;gap:28px;margin:25px 0;padding:22px;background:#f5f5ed}.average-rating{text-align:center;border-left:1px solid #dfe0d5;padding-left:24px}.average-rating strong{display:block;font:700 46px Georgia;color:#19352b}.stars{color:#c87935;letter-spacing:2px;font-size:20px}.rating-count{display:block;color:#69756b;font-size:12px;margin-top:5px}.distribution{display:grid;gap:6px;align-content:center}.rating-row{display:grid;grid-template-columns:45px 1fr 32px;align-items:center;gap:8px;font-size:12px;color:#69756b}.rating-track{height:8px;background:#e2e5d9;border-radius:8px;overflow:hidden}.rating-fill{height:100%;background:#c87935;border-radius:8px}.review-form{display:grid;gap:10px;max-width:700px;margin-top:26px;padding:22px;border:1px solid #e5e7dd;background:#fbfbf6}.review-form textarea,.review-form input{padding:12px;border:1px solid #dfe0d5;background:white;font:14px Cairo}.review-form textarea{min-height:110px;resize:vertical}.review-form label{font-size:13px;font-weight:700}.star-picker{display:flex;direction:rtl;justify-content:flex-start;gap:3px}.star-picker button{border:0;background:transparent;color:#c9cdbf;font-size:31px;line-height:1;cursor:pointer;padding:2px}.star-picker button:hover,.star-picker button.active{color:#c87935}.rating-hint{color:#69756b;font-size:12px;margin:0}.review-image-preview{display:none;max-width:110px;max-height:110px;object-fit:cover;border:1px solid #dfe0d5}.review-image-preview.visible{display:block}.char-count{font-size:11px;color:#69756b;text-align:left;direction:ltr}.review-list{margin-top:28px}.review-card{padding:18px 0;border-bottom:1px solid #dfe0d5}.review-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.review-card-head strong{font-size:15px}.review-date{font-size:11px;color:#89938a}.review-card p{line-height:1.9;color:#566359;margin:9px 0}.review-card img{max-width:150px;max-height:150px;object-fit:cover;margin-top:8px;border-radius:4px}.verified-badge{color:#687941;font-size:11px}.anonymous-note{color:#69756b;font-size:13px}@media(max-width:760px){.product-detail{grid-template-columns:1fr;padding:16px}.detail-info h1{font-size:28px}.reviews-summary{grid-template-columns:1fr}.average-rating{border-left:0;border-bottom:1px solid #dfe0d5;padding:0 0 18px}.reviews-heading{display:block}.reviews-heading h2{font-size:31px}}
  </style>
</head>
<body>
  <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">ش</span><span><strong>شجرتي</strong><small>من أرضنا لبيتك</small></span></a><a class="button button-dark" href="index.html#products">العودة للمنتجات</a></header>
  <main class="product-page">
    <div class="breadcrumbs"><a href="index.html">الرئيسية</a> / تفاصيل المنتج</div>
    <div id="productDetail">جارِ تحميل المنتج…</div>
    <section class="reviews-area">
      <div class="reviews-heading"><div><p class="eyebrow">تجارب حقيقية</p><h2>تقييمات العملاء</h2></div><span class="verified-badge">آراء من زوار شجرتي</span></div>
      <div id="reviewsSummary" class="reviews-summary"><div class="average-rating">جارِ تحميل التقييمات…</div></div>
      <form id="reviewForm" class="review-form">
        <label>تقييمك</label><div class="star-picker" id="starPicker" role="radiogroup" aria-label="اختر تقييمًا من خمس نجوم"><button type="button" data-rating="5" aria-label="5 نجوم">★</button><button type="button" data-rating="4" aria-label="4 نجوم">★</button><button type="button" data-rating="3" aria-label="3 نجوم">★</button><button type="button" data-rating="2" aria-label="نجمتان">★</button><button type="button" data-rating="1" aria-label="نجمة واحدة">★</button></div><input type="hidden" name="rating" id="ratingValue"><p class="rating-hint" id="ratingHint">اضغط على عدد النجوم الذي يعبر عن تجربتك</p>
        <label for="reviewComment">اكتب تجربتك</label><textarea id="reviewComment" name="comment" maxlength="500" placeholder="ما الذي أعجبك في الزيت؟" required></textarea><div class="char-count"><span id="commentCount">0</span>/500</div>
        <label for="reviewImage">صورة من تجربتك (اختياري)</label><input id="reviewImage" name="review_image" type="file" accept="image/jpeg,image/png,image/webp"><img id="reviewImagePreview" class="review-image-preview" alt="معاينة صورة التقييم">
        <button class="button button-primary" id="reviewSubmit" type="submit">نشر التقييم</button><p id="reviewMessage" class="admin-msg" aria-live="polite"></p>
      </form>
      <div id="reviewList" class="review-list">جارِ تحميل التقييمات…</div>
    </section>
  </main>
  <script src="product.js"></script>
</body>
</html>
