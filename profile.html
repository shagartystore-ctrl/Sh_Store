<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>بروفايلي وطلباتي | شجرتي</title><link rel="stylesheet" href="styles.css"><style>
.profile-page{max-width:1080px;margin:55px auto;padding:0 24px}.profile-hero,.orders-panel{background:#fffdf8;border:1px solid #dfe0d5;padding:32px;margin-bottom:24px}.profile-hero h1{font:700 42px Georgia;margin:0 0 12px}.profile-page .profile-form{max-width:700px}.profile-identity{display:flex;align-items:center;gap:18px}.avatar-picker{position:relative;display:grid;place-items:center;gap:4px;color:#69756b;font-size:11px;cursor:pointer}.avatar-picker img{width:82px;height:82px;border-radius:50%;object-fit:cover;background:#e9ece4;border:3px solid #e5c49f}.avatar-picker input{position:absolute;inset:0;opacity:0;cursor:pointer}.profile-page .profile-form{display:flex;align-items:center;gap:8px;margin:0}.profile-page .profile-form input{background:#fff;border:1px solid #dfe0d5;padding:12px;font:14px Cairo}.profile-message{color:#c87935}.profile-order{border:1px solid #dfe0d5;padding:20px;margin-top:16px;background:#f8f7f0}.profile-order-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.profile-order-head strong{font-size:18px}.profile-order-head span{color:#c87935;font-weight:700}.order-date{font-size:12px;color:#69756b}.profile-stages{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}.profile-stages span{background:#e9ece4;color:#69756b;border-radius:18px;padding:8px 12px;font-size:12px}.profile-stages span.active{background:#c87935;color:white}.empty-orders{padding:30px 0;color:#69756b}@media(max-width:650px){.profile-identity{align-items:stretch}.profile-page .profile-form{flex:1}.profile-page .profile-form input{min-width:0}.profile-order-head{display:grid}}
</style></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">ش</span><span><strong>شجرتي</strong><small>من أرضنا لبيتك</small></span></a><a class="button button-dark" href="index.html#products">العودة للمتجر</a></header><main class="profile-page"><section class="profile-hero"><div class="profile-identity"><label class="avatar-picker" for="avatarFile"><img id="avatarPreview" alt="صورتك الشخصية"><span>تغيير الصورة</span><input id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp"></label><form id="profileForm" class="profile-form"><input name="name" placeholder="اسمك" aria-label="اسم الحساب" required><button class="button button-primary" type="submit">حفظ</button></form></div><p id="profileMessage" class="profile-message" aria-live="polite"></p></section><section class="orders-panel"><h2>طلباتي ومراحلها</h2><div id="ordersList">جارِ تحميل الطلبات…</div></section></main><script src="profile.js"></script></body></html>
